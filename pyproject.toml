[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-bench"
version = "0.1.0"
description = "Replay harness for admission decisions made from stale capacity records"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew H. Bond" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Networking",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
stale-bench = "stale_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stale_bench = ["scenarios/*.json", "data/**/*.csv", "data/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
